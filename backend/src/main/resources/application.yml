spring:
  application:
    name: abhiknow-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/abhiknow}
    username: ${POSTGRES_USER:abhiknow}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
abhiknow:
  contact-email: ${ABHIKNOW_CONTACT_EMAIL:you@example.com}
  provider-timeout-ms: ${ABHIKNOW_PROVIDER_TIMEOUT_MS:8000}
  openalex-api-key: ${OPENALEX_API_KEY:}
  cors-origins: ${ABHIKNOW_CORS_ORIGINS:http://localhost:5173}
