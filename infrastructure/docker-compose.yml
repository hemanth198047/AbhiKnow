services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abhiknow}
      POSTGRES_USER: ${POSTGRES_USER:-abhiknow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abhiknow} -d ${POSTGRES_DB:-abhiknow}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
